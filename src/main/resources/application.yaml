server:
  port: ${SERVER_PORT:8080}

spring:
  web:
    error:
      # Devolve o motivo dos erros (ex.: "Email ou senha inválidos.") no campo "message",
      # que o front-end mostra ao usuário. Sem isso o Spring esconde o texto.
      include-message: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:true}

app:
  auth:
    # Assina o token das contas (consumidor/feirante). Em produção defina AUTH_TOKEN_SECRET
    # em /etc/xepamais/api.env; vazio = sorteado a cada início (reiniciar a API desloga todos).
    token-secret: ${AUTH_TOKEN_SECRET:}
  ia:
    # Chave da API do Gemini (Xepinha). Só no servidor: em produção defina GEMINI_API_KEY em
    # /etc/xepamais/api.env. Vazia = a Xepinha responde que está indisponível.
    gemini-api-key: ${GEMINI_API_KEY:}
    modelos: ${GEMINI_MODELOS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
  cors:
    # Lista separada por vírgula. Na EC2 vem de APP_CORS_ALLOWED_ORIGINS (/etc/xepamais/api.env).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.xepamais.com.br,https://xepamais.com.br,https://xepa-mais.vercel.app,http://localhost:5173}
  admin:
    # Login do painel /admin. A senha fica só como hash PBKDF2 (igual às contas).
    # Para trocar em produção, defina ADMIN_EMAIL / ADMIN_SENHA_HASH em /etc/xepamais/api.env.
    email: ${ADMIN_EMAIL:xepamais8@gmail.com}
    senha-hash: ${ADMIN_SENHA_HASH:pbkdf2$210000$6moDCGh5jbio52aeFaW5OQ==$Z0xQZFIMM7LlK0n7B/ye8DrjlZuDiPEXdYfQiQ3ZD64=}
    # Chave que assina o token do admin. Vazia = sorteada a cada início da API.
    token-secret: ${ADMIN_TOKEN_SECRET:}
