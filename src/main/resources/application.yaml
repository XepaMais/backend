server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:true}

app:
  cors:
    # Lista separada por vírgula. Na EC2 vem de APP_CORS_ALLOWED_ORIGINS (/etc/xepamais/api.env).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.xepamais.com.br,https://xepamais.com.br,https://xepa-mais.vercel.app,http://localhost:5173}
