server:
  port: ${SERVER_PORT:8080}

spring:
  web:
    error:
      # Devolve o motivo dos erros (ex.: "Email ou senha inválidos.") no campo "message"
      include-message: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}

app:
  auth:
    # Assina o token das contas 
    token-secret: ${AUTH_TOKEN_SECRET:}
  ia:
    # Chave da API do Gemini (Xepinha)
    gemini-api-key: ${GEMINI_API_KEY:}
    modelos: ${GEMINI_MODELOS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.xepamais.com.br,https://xepamais.com.br,https://xepa-mais.vercel.app,http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    senha-hash: ${ADMIN_SENHA_HASH:}
    token-secret: ${ADMIN_TOKEN_SECRET:}
  lgpd:
    # Versão dos Termos de Uso / Política de Privacidade gravada no aceite de cada conta.
    versao-termos: ${LGPD_VERSAO_TERMOS:1.0}

# Documentação da API: https://xepamais.com.br/api/docs 
springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
